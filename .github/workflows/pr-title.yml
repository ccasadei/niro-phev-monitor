# Con il merge in squash il titolo della PR diventa il commit su main: deve essere un Conventional Commit
# (es. "feat: ...", "fix(obd): ...", "feat!: ...") perché release-please calcoli versione e changelog.
name: Titolo PR

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: Titolo PR semantico
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            style
            revert
